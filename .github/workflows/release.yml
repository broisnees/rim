name: Release

# Push a tag like v1.0.0 to build a universal DMG and draft a GitHub release.
# With the signing secrets below, the app is Developer ID signed and notarized; without them the DMG is
# ad-hoc signed (fine for testing, Gatekeeper will warn).
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD, DEVELOPER_ID   (e.g. "Developer ID Application: Name (TEAMID)")
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8_BASE64              (App Store Connect API key)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Import Developer ID certificate
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; PW="$(uuidgen)"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build universal app
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID != '' && secrets.DEVELOPER_ID || '-' }}
          NO_TIMESTAMP: ${{ secrets.DEVELOPER_ID == '' && '1' || '' }}
        run: |
          VERSION="${VERSION#v}" BUILD="${{ github.run_number }}" ./build.sh --release
          lipo -archs build/Rim.app/Contents/MacOS/Rim

      - name: Notarize app
        if: ${{ env.HAS_NOTARY == 'true' }}
        env:
          HAS_NOTARY: ${{ secrets.NOTARY_KEY_ID != '' }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent build/Rim.app "$RUNNER_TEMP/Rim.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Rim.zip" --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          xcrun stapler staple build/Rim.app

      - name: Package DMG
        run: |
          mkdir -p dmg && cp -R build/Rim.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Rim -srcfolder dmg -ov -format UDZO "Rim-${VERSION#v}.dmg"
          shasum -a 256 "Rim-${VERSION#v}.dmg" | tee "Rim-${VERSION#v}.dmg.sha256"

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" Rim-*.dmg Rim-*.dmg.sha256 --draft --generate-notes --title "Rim ${VERSION#v}"
